<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创业信号 · 历史报告</title>
<style>
  :root {
    --bg:#0d0f14; --card:#161922; --border:#252836;
    --text:#e2e8f0; --muted:#8892a4; --accent:#7c6af7;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text);
          font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
          font-size:14px; padding:40px 16px; }
  .wrap { max-width:640px; margin:0 auto; }
  h1 { font-size:24px; font-weight:700; margin-bottom:4px; }
  h1 span { color:var(--accent); }
  .sub { color:var(--muted); font-size:13px; margin-bottom:32px; }
  .row {
    display:flex; align-items:center; gap:12px;
    background:var(--card); border:1px solid var(--border);
    border-radius:10px; padding:14px 18px; margin-bottom:10px;
    text-decoration:none; color:var(--text);
    transition:border-color .15s, background .15s;
  }
  .row:hover { border-color:var(--accent); background:#1a1d27; }
  .date { font-weight:600; font-size:15px; min-width:100px; }
  .badge {
    border:1px solid; border-radius:4px;
    padding:2px 8px; font-size:11px; font-weight:600;
    white-space:nowrap;
  }
  .counts { display:flex; gap:10px; flex:1; font-size:12px; color:var(--muted); }
  .new { color:#06d6a0; }
  .arrow { color:var(--muted); margin-left:auto; }
  .footer { text-align:center; color:var(--muted); font-size:11px; margin-top:24px; }
</style>
</head>
<body>
<div class="wrap">

  <p class="sub">共 1 期报告 · 最后更新 2026-05-21 17:47</p>
  
        <a class="row" href="reports/signal-report-2026-05-21-d.html">
          <span class="date">2026-05-21</span>
          <span class="badge" style="background:#06d6a022;color:#06d6a0;border-color:#06d6a044">日扫</span>
          <span class="counts">
            <span class="new">+? 新信号</span>
            <span class="rep">🔁 ?</span>
          </span>
          <span class="arrow">→</span>
        </a>

</div>
</body>
</html>
